name: Clone checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lab/package-lock.json
      - run: npm ci --prefix tools/lab
      - run: npx playwright install --with-deps chromium
        working-directory: tools/lab
      - run: npm --prefix tools/lab run typecheck
      - run: npm --prefix tools/lab test
      - run: node scripts/check-release.mjs
